[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "option-sentinel"
version = "0.1.0"
description = "Safety-focused terminal dashboard for monitoring and managing option positions, orders, risk, and intraday charts."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["options", "trading", "risk", "schwab", "terminal", "tui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console :: Curses",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "rich>=13.7",
    "schwab-py>=1.5",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.2",
]

[project.urls]
Homepage = "https://github.com/TitanUranus67/option-sentinel"
Repository = "https://github.com/TitanUranus67/option-sentinel.git"
Issues = "https://github.com/TitanUranus67/option-sentinel/issues"

[project.scripts]
option-sentinel = "option_sentinel.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
